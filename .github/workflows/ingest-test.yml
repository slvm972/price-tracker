name: ingest-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-update
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Jerusalem
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Скачать копию базы и пробный пакет файлов
        run: |
          gh release download db-latest --repo ${{ github.repository }} --pattern prices.db.zip
          gh release download db-latest --repo ${{ github.repository }} --pattern home-dumps-test.zip
          unzip -q -o prices.db.zip
          unzip -q -o home-dumps-test.zip
          ls -l prices.db home-dumps-test.zip
          for d in dumps/*; do echo "$d: $(ls "$d" | wc -l) файлов"; done

      - name: Записей в базе ДО наката
        run: |
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect('prices.db')
          print('цен:', c.execute('select count(*) from prices').fetchone()[0])
          EOF

      - name: Накат файлов в копию базы (режим offline)
        run: |
          date
          python -u download_all.py --offline --chains HaziHinam,SuperPharm,YaynotBitanAndCarrefour,HetCohenNewSource,VictoryNewSource > ingest.log 2>&1 || true
          date
          grep -E "RESULT|OK |Ошибка|Error|Traceback" ingest.log || true

      - name: Хвост журнала
        if: always()
        run: tail -n 30 ingest.log

      - name: Записей в базе ПОСЛЕ наката
        run: |
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect('prices.db')
          print('quick_check:', c.execute('pragma quick_check').fetchone()[0])
          print('цен:', c.execute('select count(*) from prices').fetchone()[0])
          EOF
