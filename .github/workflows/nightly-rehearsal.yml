name: nightly-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-update
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Скачать базу из релиза и распаковать
        run: |
          gh release download db-latest --repo ${{ github.repository }} --pattern prices.db.zip
          unzip -o prices.db.zip
          ls -l prices.db

      - name: Записей в таблицах ДО сбора
        run: |
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect('prices.db')
          for (t,) in c.execute("select name from sqlite_master where type='table' and name not like 'sqlite_%'"):
              print(t, c.execute(f'select count(*) from "{t}"').fetchone()[0])
          EOF

      - name: Сбор по сетям (каждая отдельным процессом, до 2 попыток)
        run: |
          CHAINS="Bareket CityMarketKiryatGat CityMarketShops DorAlon GoodPharm Keshet KingStore Maayan2000 MeshnatYosef1 MeshnatYosef2 Osherad Polizer RamiLevy SalachDabach ShefaBarcartAshem Shufersal ShukAhir StopMarket SuperYuda SuperSapir FreshMarketAndSuperDosh TivTaam Wolt Yellow Yohananof ZolVeBegadol"
          : > summary.txt
          for c in $CHAINS; do
            for attempt in 1 2; do
              echo "=== $c, попытка $attempt ==="
              if timeout 20m python -u download_all.py --chains "$c" --force-scrape --limit 50 > "log_$c.txt" 2>&1; then
                break
              fi
            done
            echo "::group::$c (последние 40 строк журнала)"
            tail -n 40 "log_$c.txt" || true
            echo "::endgroup::"
            line=$(grep -E "RESULT chain=" "log_$c.txt" | tail -n 1 || true)
            if [ -z "$line" ]; then line="RESULT chain=$c status=NO_RESULT"; fi
            echo "$line" >> summary.txt
          done

      - name: Итог по сетям
        if: always()
        run: cat summary.txt

      - name: Записей в таблицах ПОСЛЕ сбора
        run: |
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect('prices.db')
          for (t,) in c.execute("select name from sqlite_master where type='table' and name not like 'sqlite_%'"):
              print(t, c.execute(f'select count(*) from "{t}"').fetchone()[0])
          EOF

      - name: Сжать и загрузить под именем prices-test.db.zip
        run: |
          rm -f prices-test.db.zip
          zip -q prices-test.db.zip prices.db
          ls -l prices-test.db.zip
          gh release upload db-latest prices-test.db.zip --clobber --repo ${{ github.repository }}

      - name: Показать файлы релиза
        run: gh release view db-latest --repo ${{ github.repository }} --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
