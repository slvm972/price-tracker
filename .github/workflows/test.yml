name: Test Actions

on:
  workflow_dispatch:

jobs:
  test-few-chains:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Пробный запуск нескольких сетей
        run: python download_all.py --chains Keshet,GoodPharm,HaziHinam --force-scrape --limit 1

      - name: Сохранить журнал как файл для скачивания
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-and-db-2
          path: |
            dumps/
            prices.db
