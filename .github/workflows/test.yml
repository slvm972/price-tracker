name: test

on:
  workflow_dispatch:

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверка 8 сетей без лимита
        run: |
          python download_all.py --chains CityMarketKiryatGat,CityMarketShops,Keshet,MeshnatYosef1,MeshnatYosef2,Osherad,SuperYuda,Wolt --force-scrape 2>&1 | tee download.log

      - name: Показать ИТОГ
        if: always()
        run: grep -A 80 "ИТОГ:" download.log || echo "Раздел ИТОГ не найден"
